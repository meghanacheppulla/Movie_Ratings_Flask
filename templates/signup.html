{% extends "base.html" %}
{% block title %}Sign up · Reel Votes{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <p class="auth-card__eyebrow">First time here</p>
    <h1 class="auth-card__title">Create your account</h1>
    <p class="auth-card__sub">Takes a few seconds. No email needed.</p>

    <form method="POST" class="form">
      <label class="field">
        <span class="field__label">Username</span>
        <input class="field__input" type="text" name="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span class="field__label">Password</span>
        <input class="field__input" type="password" name="password" autocomplete="new-password" required>
      </label>
      <label class="field">
        <span class="field__label">Confirm password</span>
        <input class="field__input" type="password" name="confirm" autocomplete="new-password" required>
      </label>
      <button class="btn btn--primary btn--block" type="submit">Sign up</button>
    </form>

    <p class="auth-card__foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
